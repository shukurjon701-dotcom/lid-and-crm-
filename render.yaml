services:
  - type: web
    name: lid-crm
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    postDeployCommand: npx prisma db push && npm run db:seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_CURRENCY
        value: UZS
      - key: NEXT_PUBLIC_LOCALE
        value: ru-RU
      - key: USE_MOCK_DATA
        value: "false"
