services:
  - type: web
    name: lid-crm
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    # Только схема. Наполнение демо-данными (db:seed) стирает базу —
    # на боевой базе его запускать нельзя.
    postDeployCommand: npx prisma db push
    envVars:
      - key: NODE_ENV
        value: production
      # Без этого сервер живёт по UTC и «показатели за сегодня»
      # начинаются в 5 утра по Ташкенту.
      - key: TZ
        value: Asia/Tashkent
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_CURRENCY
        value: UZS
      - key: NEXT_PUBLIC_LOCALE
        value: ru-RU
      - key: USE_MOCK_DATA
        value: "false"
      # Виртуальная АТС onlinePBX — источник звонков call-центра
      - key: PBX_DOMAIN
        sync: false
      - key: PBX_API_KEY
        sync: false
