services:
  - type: web
    name: lid-crm
    env: node
    plan: free
    region: frankfurt
    # Схема применяется в сборке, а не в postDeployCommand: на бесплатном
    # плане пост-деплойная команда не выполняется, и приложение уходило в
    # демо-данные, потому что в базе не было новых колонок.
    #
    # `db push` только добавляет недостающее и падает на разрушающих правках,
    # а наполнение демо-данными (db:seed) стирает базу — его на боевой базе
    # запускать нельзя.
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      # Без этого сервер живёт по UTC и «показатели за сегодня»
      # начинаются в 5 утра по Ташкенту.
      - key: TZ
        value: Asia/Tashkent
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_CURRENCY
        value: UZS
      - key: NEXT_PUBLIC_LOCALE
        value: ru-RU
      - key: USE_MOCK_DATA
        value: "false"
      # Виртуальная АТС onlinePBX — источник звонков call-центра
      - key: PBX_DOMAIN
        sync: false
      - key: PBX_API_KEY
        sync: false
